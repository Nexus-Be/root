      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d fulfillment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 7. Notification Database (Port 5439)
  postgres-notification:
    image: postgres:16-alpine
    container_name: nexus-postgres-notification
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notification_db
    ports:
      - "${NOTIFICATION_DB_PORT:-5439}:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 8. Wallet Database (Port 5440)
  postgres-wallet:
    image: postgres:16-alpine
    container_name: nexus-postgres-wallet
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wallet_db
    ports:
      - "${WALLET_DB_PORT:-5440}:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data
    healthcheck:
