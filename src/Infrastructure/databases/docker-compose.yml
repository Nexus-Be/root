# =============================================================================
# NEXUS LOCAL POSTGRESQL DATABASES CLUSTER
# =============================================================================
# Cụm 8 cơ sở dữ liệu PostgreSQL cục bộ độc lập cho 8 Microservices (Local Mode)
# Ports: 5433 - 5440
#
# Khởi chạy độc lập:
#   docker compose -f src/Infrastructure/databases/docker-compose.yml up -d
# =============================================================================

name: nexus-local-databases

services:
  # 1. User Database (Port 5433)
  postgres-user:
    image: postgres:16-alpine
    container_name: nexus-postgres-user
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: usermanagement_db
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d usermanagement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Catalog Database (Port 5434)
  postgres-catalog:
    image: postgres:16-alpine
    container_name: nexus-postgres-catalog
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: category_db
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d category_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. Commerce Database (Port 5435)
  postgres-commerce:
    image: postgres:16-alpine
    container_name: nexus-postgres-commerce
