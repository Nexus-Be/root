      - postgres_commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d commerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. Log Database (Port 5436)
  postgres-log:
    image: postgres:16-alpine
    container_name: nexus-postgres-log
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: log_db
    ports:
      - "${LOG_DB_PORT:-5436}:5432"
    volumes:
      - postgres_log_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 5. Auction Database (Port 5437)
  postgres-auction:
    image: postgres:16-alpine
    container_name: nexus-postgres-auction
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auction_db
    ports:
      - "${AUCTION_DB_PORT:-5437}:5432"
    volumes:
      - postgres_auction_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auction_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 6. Fulfillment Database (Port 5438)
  postgres-fulfillment:
    image: postgres:16-alpine
    container_name: nexus-postgres-fulfillment
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fulfillment_db
    ports:
      - "${FULFILLMENT_DB_PORT:-5438}:5432"
    volumes:
      - postgres_fulfillment_data:/var/lib/postgresql/data
