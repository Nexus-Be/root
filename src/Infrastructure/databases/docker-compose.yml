      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true

volumes:
  postgres_user_data:
    name: nexus-local_postgres_user_data
  postgres_catalog_data:
    name: nexus-local_postgres_catalog_data
  postgres_commerce_data:
    name: nexus-local_postgres_commerce_data
  postgres_log_data:
    name: nexus-local_postgres_log_data
  postgres_auction_data:
    name: nexus-local_postgres_auction_data
  postgres_fulfillment_data:
    name: nexus-local_postgres_fulfillment_data
  postgres_notification_data:
    name: nexus-local_postgres_notification_data
  postgres_wallet_data:
    name: nexus-local_postgres_wallet_data
