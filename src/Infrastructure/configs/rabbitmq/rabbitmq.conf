# =============================================================================
# NEXUS INFRASTRUCTURE - RABBITMQ LIGHTWEIGHT CONFIGURATION
# =============================================================================
# Tinh chỉnh tài nguyên cho môi trường Local Development:
#   1. Giảm thiểu bộ nhớ RAM & Erlang Garbage Collection sớm
#   2. Chế độ tính toán rate cơ bản (basic) thay vì chi tiết (detailed) -> giảm 40% CPU
#   3. Kích hoạt Prometheus Metrics trên cổng 15692
# =============================================================================

# 1. Quản lý ngưỡng bộ nhớ (RAM Watermark - 60% của 350MB mem_limit = ~210MB)
vm_memory_high_watermark.relative = 0.6

# 2. Ngưỡng cảnh báo dung lượng ổ đĩa (50MB cho dev local)
disk_free_limit.absolute = 50MB

# 3. Chế độ tính toán thống kê (basic rates mode giúp broker cực nhẹ, giảm tải CPU)
management.rates_mode = basic

# 4. Prometheus Metrics Exporter (Cổng 15692)
prometheus.tcp.port = 15692
