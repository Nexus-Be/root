# =============================================================================
# NEXUS MICROSERVICES - INFRASTRUCTURE & LOCAL DATABASES
# =============================================================================
# Dành riêng cho việc chỉ khởi chạy hạ tầng dùng chung (RabbitMQ, Redis, Tempo, Grafana)
# và 8 CSDL PostgreSQL cục bộ (5433 -> 5440) phục vụ trường hợp bạn muốn chạy các
# service .NET trực tiếp từ IDE / Visual Studio / CLI.
#
# Lệnh sử dụng:
#   docker compose -f docker-compose.infra.yml up -d
# =============================================================================

name: nexus-be

services:

  # 1. RabbitMQ (Message Bus cho MassTransit Event-Driven - Tinh chỉnh siêu nhẹ & Prometheus Metrics)
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nexus-shared-rabbitmq
    mem_limit: 450m
    deploy:
      resources:
        limits:
          memory: 450M
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +P 1048576"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 2. Redis In-Memory Store (Shared cho API Gateway Rate Limit & User Service OTP/Cache - Cổng 6379, 500MB)
  redis:
    image: redis:7-alpine
    container_name: nexus-shared-redis
    command: ["redis-server", "--maxmemory", "460mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 500m
    deploy:
      resources:
        limits:
          memory: 500M
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s
    volumes:
      - redis_data:/data

  # 3. Tempo (Distributed Tracing Backend)
  tempo:
    image: grafana/tempo:2.4.1
    container_name: nexus-shared-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT_GRPC:-4317}:4317"
      - "${TEMPO_PORT_HTTP:-4318}:4318"
      - "${TEMPO_PORT_UI:-3200}:3200"
    restart: unless-stopped

  # 4. Prometheus (Metrics Store & RED Metrics Receiver từ Tempo)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexus-shared-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # 5. Grafana (Dashboard trực quan hóa Metrics, Traces & Observability)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nexus-shared-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/nexus_overview.json
    volumes:
      - ./infra/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

  # =========================================================================
  # CƠ SỞ DỮ LIỆU POSTGRESQL CỤC BỘ (LOCAL DATABASES - CỔNG 5433 -> 5440)
  # =========================================================================

  # 6. User Service Database (usermanagement_db - Port 5433)
  user-db:
    image: postgres:16-alpine
    container_name: nexus-user-db
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: usermanagement_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d usermanagement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 7. Catalog Service Database (catalog_db - Port 5434)
  catalog-db:
    image: postgres:16-alpine
    container_name: nexus-catalog-db
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: catalog_db
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 8. Commerce Service Database (commerce_db - Port 5435)
  commerce-db:
    image: postgres:16-alpine
    container_name: nexus-commerce-db
    ports:
      - "${COMMERCE_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: commerce_db
    volumes:
      - commerce_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d commerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 9. Log Service Database (log_db - Port 5436)
  log-db:
    image: postgres:16-alpine
    container_name: nexus-log-db
    ports:
      - "${LOG_DB_PORT:-5436}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: log_db
    volumes:
      - log_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 10. Auction Service Database (auction_db - Port 5437)
  auction-db:
    image: postgres:16-alpine
    container_name: nexus-auction-db
    ports:
      - "${AUCTION_DB_PORT:-5437}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auction_db
    volumes:
      - auction_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auction_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 11. Fulfillment Service Database (fulfillment_db - Port 5438)
  fulfillment-db:
    image: postgres:16-alpine
    container_name: nexus-fulfillment-db
    ports:
      - "${FULFILLMENT_DB_PORT:-5438}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fulfillment_db
    volumes:
      - fulfillment_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d fulfillment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 12. Notification Service Database (notification_db - Port 5439)
  notification-db:
    image: postgres:16-alpine
    container_name: nexus-notification-db
    ports:
      - "${NOTIFICATION_DB_PORT:-5439}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notification_db
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 13. Wallet Service Database (wallet_db - Port 5440)
  wallet-db:
    image: postgres:16-alpine
    container_name: nexus-wallet-db
    ports:
      - "${WALLET_DB_PORT:-5440}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wallet_db
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
