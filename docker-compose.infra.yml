    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tempo_data:
  user_db_data:
  catalog_db_data:
  commerce_db_data:
  log_db_data:
  auction_db_data:
  fulfillment_db_data:
  notification_db_data:
  wallet_db_data:
