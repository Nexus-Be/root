# =============================================================================
# NEXUS MICROSERVICES - INFRASTRUCTURE ONLY
# =============================================================================
# Dành riêng cho việc chỉ khởi chạy hạ tầng dùng chung (RabbitMQ, Redis, Tempo, Grafana)
# phục vụ trường hợp bạn muốn chạy các service .NET trực tiếp từ IDE / Visual Studio / CLI.
# Toàn bộ PostgreSQL Database đã lưu và quản lý tập trung trên Neon Cloud.
#
# Lệnh sử dụng:
#   docker compose -f docker-compose.infra.yml up -d
# =============================================================================

name: nexus-be

services:

  # 1. RabbitMQ (Message Bus cho MassTransit Event-Driven)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-shared-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 2. Redis (Bộ nhớ đệm phân tán & Rate Limiting cục bộ)
  redis:
    image: redis:7-alpine
    container_name: nexus-shared-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s
    volumes:
      - redis_data:/data

  # 3. Tempo (Distributed Tracing Backend)
  tempo:
    image: grafana/tempo:2.4.1
    container_name: nexus-shared-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT_GRPC:-4317}:4317"
      - "${TEMPO_PORT_HTTP:-4318}:4318"
      - "${TEMPO_PORT_UI:-3200}:3200"
    restart: unless-stopped

  # 4. Grafana (Dashboard trực quan hóa Metrics & Traces)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nexus-shared-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

# =============================================================================
# MẠNG DÙNG CHUNG & VOLUMES LƯU TRỮ DỮ LIỆU
# =============================================================================
networks:
  default:
    name: nexus-network

volumes:
  redis_data:
    name: nexus-be_redis_data
  tempo_data:
    name: nexus-be_tempo_data
