# =============================================================================
# NEXUS MICROSERVICES - INFRASTRUCTURE ONLY
# =============================================================================
# Dành riêng cho việc chỉ khởi chạy hạ tầng dùng chung (RabbitMQ, Redis, Tempo, Grafana)
# phục vụ trường hợp bạn muốn chạy các service .NET trực tiếp từ IDE / Visual Studio / CLI.
# Toàn bộ PostgreSQL Database đã lưu và quản lý tập trung trên Neon Cloud.
#
# Lệnh sử dụng:
#   docker compose -f docker-compose.infra.yml up -d
# =============================================================================

name: nexus-be

services:

  # 1. RabbitMQ (Message Bus cho MassTransit Event-Driven - Tinh chỉnh siêu nhẹ & Prometheus Metrics)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-shared-rabbitmq
    mem_limit: 350m
    deploy:
      resources:
        limits:
          memory: 350M
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +P 1048576"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 2. Redis In-Memory Store (Shared cho API Gateway Rate Limit & User Service OTP/Cache - Cổng 6379, 500MB)
  redis:
    image: redis:7-alpine
    container_name: nexus-shared-redis
    command: ["redis-server", "--maxmemory", "460mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 500m
    deploy:
      resources:
        limits:
          memory: 500M
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s
    volumes:
      - redis_data:/data

  # 3. Tempo (Distributed Tracing Backend)
  tempo:
    image: grafana/tempo:2.4.1
    container_name: nexus-shared-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT_GRPC:-4317}:4317"
      - "${TEMPO_PORT_HTTP:-4318}:4318"
      - "${TEMPO_PORT_UI:-3200}:3200"
    restart: unless-stopped

  # 4. Prometheus (Metrics Store & RED Metrics Receiver từ Tempo)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexus-shared-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # 5. Grafana (Dashboard trực quan hóa Metrics, Traces & Observability)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nexus-shared-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/nexus_overview.json
    volumes:
      - ./infra/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

# =============================================================================
# MẠNG DÙNG CHUNG & VOLUMES LƯU TRỮ DỮ LIỆU
# =============================================================================
networks:
  default:
    name: nexus-network
    external: true

volumes:
  redis_data:
    name: nexus-be_redis_data
  tempo_data:
    name: nexus-be_tempo_data
  prometheus_data:
    name: nexus-be_prometheus_data
