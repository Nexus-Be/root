# =============================================================================
# MẠNG DÙNG CHUNG & VOLUMES LƯU TRỮ DỮ LIỆU
# =============================================================================
networks:
  default:
    name: nexus-network
    external: true

volumes:
  redis_data:
    name: nexus-be_redis_data
  tempo_data:
    name: nexus-be_tempo_data
  prometheus_data:
    name: nexus-be_prometheus_data
  user_db_data:
    name: nexus-be_user_db_data
  catalog_db_data:
    name: nexus-be_catalog_db_data
  commerce_db_data:
    name: nexus-be_commerce_db_data
  log_db_data:
    name: nexus-be_log_db_data
  auction_db_data:
    name: nexus-be_auction_db_data
  fulfillment_db_data:
    name: nexus-be_fulfillment_db_data
  notification_db_data:
    name: nexus-be_notification_db_data
  wallet_db_data:
    name: nexus-be_wallet_db_data
