# =============================================================================
# NEXUS MICROSERVICES - STANDALONE DATABASES COMPOSE (LOCAL POSTGRESQL 5433-5440)
# =============================================================================
# Chỉ chạy độc lập 8 container CSDL PostgreSQL cho 8 microservices.
#
# Cách sử dụng:
#   cd infra/databases
#   docker compose up -d
#
# Dừng cụm database:
#   docker compose down
# =============================================================================

name: nexus-databases

services:

  # 1. User Service Database (usermanagement_db - Port 5433)
  user-db:
    image: postgres:16-alpine
    container_name: nexus-user-db
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: usermanagement_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d usermanagement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Catalog Service Database (catalog_db - Port 5434)
