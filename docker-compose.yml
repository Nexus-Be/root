# =============================================================================
# NEXUS ROOT STACK - 10 SERVICES
# =============================================================================
# Chạy toàn bộ stack hoặc một service bất kỳ.
#   docker compose up -d
#   docker compose up -d user-service
# Infrastructure chạy riêng bằng docker-compose.infra.yml.
# Network nexus-network phải tồn tại trước: docker network create nexus-network
# =============================================================================

name: nexus-be

services:
  gateway:
    build:
      context: ./src/Services/Gateway
      dockerfile: Dockerfile
    container_name: nexus-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Issuer: "${JWT_ISSUER:-http://localhost:8001}"
      Jwt__Audience: "${JWT_AUDIENCE:-shoppingcart-api}"
      Jwt__Signature: "${JWT_SIGNATURE:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      Redis__ConnectionString: "${REDIS_CONNECTION_STRING:-redis:6379}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      ReverseProxy__Clusters__user-cluster__Destinations__user-service__Address: "${USERS_SERVICE_URL:-${USER_SERVICE_URL:-http://user-service:8001}}"
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-service__Address: "${CATALOG_SERVICE_URL:-http://catalog-service:8002}"
      ReverseProxy__Clusters__commerce-cluster__Destinations__commerce-service__Address: "${COMMERCE_SERVICE_URL:-http://commerce-service:8003}"
      ReverseProxy__Clusters__log-cluster__Destinations__log-service__Address: "${LOG_SERVICE_URL:-http://log-service:8004}"
      ReverseProxy__Clusters__auction-cluster__Destinations__auction-service__Address: "${AUCTION_SERVICE_URL:-http://auction-service:8005}"
      ReverseProxy__Clusters__fulfillment-cluster__Destinations__fulfillment-service__Address: "${FULFILLMENT_SERVICE_URL:-http://fulfillment-service:8006}"
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address: "${NOTIFICATION_SERVICE_URL:-http://notification-service:8007}"
      ReverseProxy__Clusters__wallet-cluster__Destinations__wallet-service__Address: "${WALLET_SERVICE_URL:-http://wallet-service:8008}"
      ReverseProxy__Clusters__checkheal-cluster__Destinations__checkheal-service__Address: "${CHECKHEAL_SERVICE_URL:-http://checkheal-service:8009}"
    restart: unless-stopped

  user-service:
    build:
      context: ./src/Services/User
      dockerfile: Dockerfile
    container_name: nexus-user-service
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${USER_DB_CONNECTION:-}"
      Redis__ConnectionString: "${REDIS_CONNECTION_STRING:-redis:6379}"
      Jwt__Issuer: "${JWT_ISSUER:-http://localhost:8001}"
      Jwt__Audience: "${JWT_AUDIENCE:-shoppingcart-api}"
      Jwt__Signature: "${JWT_SIGNATURE:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification-service:8007}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  catalog-service:
    build:
      context: ./src/Services/Catalog
      dockerfile: Dockerfile
    container_name: nexus-catalog-service
    ports:
      - "${CATALOG_SERVICE_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${CATALOG_DB_CONNECTION:-}"
      FULFILLMENT_SERVICE_URL: "${FULFILLMENT_SERVICE_URL:-http://fulfillment-service:8006}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  commerce-service:
    build:
      context: ./src/Services/Commerce
      dockerfile: Dockerfile
    container_name: nexus-commerce-service
    ports:
      - "${COMMERCE_SERVICE_PORT:-8003}:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${COMMERCE_DB_CONNECTION:-}"
      WALLET_SERVICE_URL: "${WALLET_SERVICE_URL:-http://wallet-service:8008}"
      CATALOG_SERVICE_URL: "${CATALOG_SERVICE_URL:-http://catalog-service:8002}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  log-service:
    build:
      context: ./src/Services/Log
      dockerfile: Dockerfile
    container_name: nexus-log-service
    ports:
      - "${LOG_SERVICE_PORT:-8004}:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${LOG_DB_CONNECTION:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  auction-service:
    build:
      context: ./src/Services/Auction
      dockerfile: Dockerfile
    container_name: nexus-auction-service
    ports:
      - "${AUCTION_SERVICE_PORT:-8005}:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${AUCTION_DB_CONNECTION:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  fulfillment-service:
    build:
      context: ./src/Services/Fulfillment
      dockerfile: Dockerfile
    container_name: nexus-fulfillment-service
    ports:
      - "${FULFILLMENT_SERVICE_PORT:-8006}:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${FULFILLMENT_DB_CONNECTION:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  notification-service:
    build:
      context: ./src/Services/Notification
      dockerfile: Dockerfile
    container_name: nexus-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8007}:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${NOTIFICATION_DB_CONNECTION:-}"
      Jwt__Issuer: "${JWT_ISSUER:-http://localhost:8001}"
      Jwt__Audience: "${JWT_AUDIENCE:-shoppingcart-api}"
      Jwt__Signature: "${JWT_SIGNATURE:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      Smtp__Host: "${SMTP_HOST:-smtp.gmail.com}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseSsl: "${SMTP_USE_SSL:-false}"
      Smtp__SenderName: "${SMTP_SENDER_NAME:-Nexus Ecosystem}"
      Smtp__SenderEmail: "${SMTP_SENDER_EMAIL:-}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  wallet-service:
    build:
      context: ./src/Services/Wallet
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${WALLET_DB_CONNECTION:-}"
      VnPay__TmnCode: "${VNPAY_TMN_CODE:-}"
      VnPay__HashSecret: "${VNPAY_HASH_SECRET:-}"
      VnPay__PaymentUrl: "${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
      VnPay__ReturnUrl: "${VNPAY_RETURN_URL:-https://localhost:8080/api/v1/wallets/vnpay/return}"
      VnPay__Version: "${VNPAY_VERSION:-2.1.0}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

  checkheal-service:
    build:
      context: ./src/Services/CheckHeal
      dockerfile: Dockerfile
    container_name: nexus-checkheal-service
    ports:
      - "${CHECKHEAL_SERVICE_PORT:-8009}:8009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8009"
      CheckHeal__ApiKey: "${CHECKHEAL_API_KEY:-}"
      CheckHeal__CronIntervalSeconds: "${CHECKHEAL_CRON_INTERVAL:-60}"
      CheckHeal__HttpTimeoutSeconds: "${CHECKHEAL_HTTP_TIMEOUT:-5}"
      CheckHeal__DatabaseTimeoutSeconds: "${CHECKHEAL_DATABASE_TIMEOUT:-5}"
      CheckHeal__FailureThreshold: "${CHECKHEAL_FAILURE_THRESHOLD:-3}"
      CheckHeal__Services__users__Url: "${CHECKHEAL_USERS_URL:-http://user-service:8001/health}"
      CheckHeal__Services__catalog__Url: "${CHECKHEAL_CATALOG_URL:-http://catalog-service:8002/health}"
      CheckHeal__Services__commerce__Url: "${CHECKHEAL_COMMERCE_URL:-http://commerce-service:8003/health}"
      CheckHeal__Services__log__Url: "${CHECKHEAL_LOG_URL:-http://log-service:8004/health}"
      CheckHeal__Services__auction__Url: "${CHECKHEAL_AUCTION_URL:-http://auction-service:8005/health}"
      CheckHeal__Services__fulfillment__Url: "${CHECKHEAL_FULFILLMENT_URL:-http://fulfillment-service:8006/health}"
      CheckHeal__Services__notification__Url: "${CHECKHEAL_NOTIFICATION_URL:-http://notification-service:8007/health}"
      CheckHeal__Services__wallet__Url: "${CHECKHEAL_WALLET_URL:-http://wallet-service:8008/health}"
      CheckHeal__Databases__users__ConnectionString: "${CHECKHEAL_USERS_DB_CONNECTION:-${USER_DB_CONNECTION:-}}"
      CheckHeal__Databases__catalog__ConnectionString: "${CHECKHEAL_CATALOG_DB_CONNECTION:-${CATALOG_DB_CONNECTION:-}}"
      CheckHeal__Databases__commerce__ConnectionString: "${CHECKHEAL_COMMERCE_DB_CONNECTION:-${COMMERCE_DB_CONNECTION:-}}"
      CheckHeal__Databases__log__ConnectionString: "${CHECKHEAL_LOG_DB_CONNECTION:-${LOG_DB_CONNECTION:-}}"
      CheckHeal__Databases__auction__ConnectionString: "${CHECKHEAL_AUCTION_DB_CONNECTION:-${AUCTION_DB_CONNECTION:-}}"
      CheckHeal__Databases__fulfillment__ConnectionString: "${CHECKHEAL_FULFILLMENT_DB_CONNECTION:-${FULFILLMENT_DB_CONNECTION:-}}"
      CheckHeal__Databases__notification__ConnectionString: "${CHECKHEAL_NOTIFICATION_DB_CONNECTION:-${NOTIFICATION_DB_CONNECTION:-}}"
      CheckHeal__Databases__wallet__ConnectionString: "${CHECKHEAL_WALLET_DB_CONNECTION:-${WALLET_DB_CONNECTION:-}}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8009/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
