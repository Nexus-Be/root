# =============================================================================
# NEXUS MICROSERVICES - MASTER DOCKER COMPOSE
# =============================================================================
# Quy hoạch phân đoạn hệ thống:
#   1. PHẦN 1: HẠ TẦNG DÙNG CHUNG (RabbitMQ, Redis Local, Tempo, Grafana)
#   2. PHẦN 1.5: CƠ SỞ DỮ LIỆU POSTGRESQL CỤC BỘ (8 Local Databases: 5433 -> 5440)
#   3. PHẦN 2: CÁC DỊCH VỤ MICROSERVICES (.NET 8 - Gateway & 9 Services)
#   * CSDL PostgreSQL chạy container cục bộ theo nguyên tắc Database-Per-Service độc lập.
#
# BẢNG TỔNG HỢP CỔNG LOCALHOST (HOST PORT -> CONTAINER PORT):
# -----------------------------------------------------------------------------
# [Hạ Tầng Dùng Chung & CSDL Local]
#   - RabbitMQ AMQP:        5672  -> 5672
#   - RabbitMQ Web UI:     15672  -> 15672
#   - Redis In-Memory:      6379  -> 6379 (500MB - Rate Limit & User Cache)
#   - Grafana Web UI:       3000  -> 3000
#   - Tempo Tracing:        3200 (UI/API) | 4317 (gRPC) | 4318 (HTTP)
#   - Prometheus Metrics:   9090  -> 9090
#   - User DB:              5433  -> 5432 (usermanagement_db)
#   - Catalog DB:           5434  -> 5432 (catalog_db)
#   - Commerce DB:          5435  -> 5432 (commerce_db)
#   - Log DB:               5436  -> 5432 (log_db)
#   - Auction DB:           5437  -> 5432 (auction_db)
#   - Fulfillment DB:       5438  -> 5432 (fulfillment_db)
#   - Notification DB:      5439  -> 5432 (notification_db)
#   - Wallet DB:            5440  -> 5432 (wallet_db)
#
# [Các Dịch Vụ Microservices]
#   - Gateway API:          8080  -> 8080
#   - User Service:         8001  -> 8001
#   - Catalog Service:      8002  -> 8002
#   - Commerce Service:     8003  -> 8003
#   - Log Service:          8004  -> 8004
#   - Auction Service:      8005  -> 8005
#   - Fulfillment Service:  8006  -> 8006
#   - Notification Service: 8007  -> 8007
#   - Wallet Service:       8008  -> 8008
#   - CheckHeal Service:    8009  -> 8009
# =============================================================================

name: nexus-be

services:
  # =========================================================================
  # PHẦN 1: HẠ TẦNG DÙNG CHUNG (SHARED INFRASTRUCTURE)
  # =========================================================================

  # 1.1 RabbitMQ (Message Bus cho MassTransit Event-Driven - Tinh chỉnh siêu nhẹ & Prometheus Metrics)
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nexus-shared-rabbitmq
    mem_limit: 450m
    deploy:
      resources:
        limits:
          memory: 450M
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +P 1048576"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 1.2 Redis In-Memory Store (Shared cho API Gateway Rate Limit & User Service OTP/Cache - Cổng 6379, 500MB)
  redis:
    image: redis:7-alpine
    container_name: nexus-shared-redis
    command: ["redis-server", "--maxmemory", "460mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 500m
    deploy:
      resources:
        limits:
          memory: 500M
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s
    volumes:
      - redis_data:/data

  # 1.3 Tempo (Distributed Tracing Backend)
  tempo:
    image: grafana/tempo:2.4.1
    container_name: nexus-shared-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT_GRPC:-4317}:4317"
      - "${TEMPO_PORT_HTTP:-4318}:4318"
      - "${TEMPO_PORT_UI:-3200}:3200"
    restart: unless-stopped

  # 1.4 Prometheus (Metrics Store & RED Metrics Receiver từ Tempo)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexus-shared-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # 1.5 Grafana (Dashboard trực quan hóa Metrics, Traces & Observability)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nexus-shared-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/nexus_overview.json
    volumes:
      - ./infra/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

  # =========================================================================
  # PHẦN 1.5: CƠ SỞ DỮ LIỆU POSTGRESQL CỤC BỘ (LOCAL DATABASES - CỔNG 5433 -> 5440)
  # =========================================================================

  # 1.6 User Service Database (usermanagement_db - Port 5433)
  user-db:
    image: postgres:16-alpine
    container_name: nexus-user-db
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: usermanagement_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d usermanagement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.7 Catalog Service Database (catalog_db - Port 5434)
  catalog-db:
    image: postgres:16-alpine
    container_name: nexus-catalog-db
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: catalog_db
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.8 Commerce Service Database (commerce_db - Port 5435)
  commerce-db:
    image: postgres:16-alpine
    container_name: nexus-commerce-db
    ports:
      - "${COMMERCE_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: commerce_db
    volumes:
      - commerce_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d commerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.9 Log Service Database (log_db - Port 5436)
  log-db:
    image: postgres:16-alpine
    container_name: nexus-log-db
    ports:
      - "${LOG_DB_PORT:-5436}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: log_db
    volumes:
      - log_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.10 Auction Service Database (auction_db - Port 5437)
  auction-db:
    image: postgres:16-alpine
    container_name: nexus-auction-db
    ports:
      - "${AUCTION_DB_PORT:-5437}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auction_db
    volumes:
      - auction_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auction_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.11 Fulfillment Service Database (fulfillment_db - Port 5438)
  fulfillment-db:
    image: postgres:16-alpine
    container_name: nexus-fulfillment-db
    ports:
      - "${FULFILLMENT_DB_PORT:-5438}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fulfillment_db
    volumes:
      - fulfillment_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d fulfillment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.12 Notification Service Database (notification_db - Port 5439)
  notification-db:
    image: postgres:16-alpine
    container_name: nexus-notification-db
    ports:
      - "${NOTIFICATION_DB_PORT:-5439}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notification_db
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1.13 Wallet Service Database (wallet_db - Port 5440)
  wallet-db:
    image: postgres:16-alpine
    container_name: nexus-wallet-db
    ports:
      - "${WALLET_DB_PORT:-5440}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wallet_db
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # PHẦN 2: CÁC DỊCH VỤ ỨNG DỤNG (MICROSERVICES APPLICATIONS)
  # =========================================================================

  # 2.1 API Gateway (Điểm vào duy nhất - Port 8080)
  gateway:
    build:
      context: ./src/Services/ApiGateway
      dockerfile: Dockerfile
    container_name: nexus-apigateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - Gateway__AuthMode=${GATEWAY_AUTH_MODE:-Enforce}
      - Gateway__RedisConnectionString=${REDIS_CONNECTION_STRING:-redis:6379}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - Gateway__Services__users__Address=${USERS_SERVICE_URL:-http://user-service:8001}
      - Gateway__Services__catalog__Address=${CATALOG_SERVICE_URL:-http://catalog-service:8002}
      - Gateway__Services__commerce__Address=${COMMERCE_SERVICE_URL:-http://commerce-service:8003}
      - Gateway__Services__log__Address=${LOG_SERVICE_URL:-http://log-service:8004}
      - Gateway__Services__auction__Address=${AUCTION_SERVICE_URL:-http://auction-service:8005}
      - Gateway__Services__fulfillment__Address=${FULFILLMENT_SERVICE_URL:-http://fulfillment-service:8006}
      - Gateway__Services__notification__Address=${NOTIFICATION_SERVICE_URL:-http://notification-service:8007}
      - Gateway__Services__wallet__Address=${WALLET_SERVICE_URL:-http://wallet-service:8008}
      - Gateway__Services__healthcheck__Address=${HEALTHCHECK_SERVICE_URL:-http://checkheal-service:8009}
      - Gateway__HealthProber__ApiKey=${CHECKHEAL_API_KEY}
      - CHECKHEAL_API_KEY=${CHECKHEAL_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # 2.2 User Service (Auth, OTP, Profile, Roles - Port 8001)
  user-service:
    build:
      context: ./src/Services/User
      dockerfile: Dockerfile
    container_name: nexus-user-service
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${USER_CONNECTION_STRING:-Host=user-db;Port=5432;Database=usermanagement_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis:6379}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
      user-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.3 Catalog Service (Sản phẩm, danh mục, kho ảo seller - Port 8002)
  catalog-service:
    build:
      context: ./src/Services/Catalog
      dockerfile: Dockerfile
    container_name: nexus-catalog-service
    ports:
      - "${CATALOG_SERVICE_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CATALOG_CONNECTION_STRING:-Host=catalog-db;Port=5432;Database=catalog_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.4 Commerce Service (Giỏ hàng, Đơn hàng, Checkout Saga - Port 8003)
  commerce-service:
    build:
      context: ./src/Services/Commerce
      dockerfile: Dockerfile
    container_name: nexus-commerce-service
    ports:
      - "${COMMERCE_SERVICE_PORT:-8003}:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${COMMERCE_CONNECTION_STRING:-Host=commerce-db;Port=5432;Database=commerce_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      commerce-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.5 Log Service (Audit Log tập trung - Port 8004)
  log-service:
    build:
      context: ./src/Services/Log
      dockerfile: Dockerfile
    container_name: nexus-log-service
    ports:
      - "${LOG_SERVICE_PORT:-8004}:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${LOG_CONNECTION_STRING:-Host=log-db;Port=5432;Database=log_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      log-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.6 Auction Service (Đấu giá, đặt giá bid - Port 8005)
  auction-service:
    build:
      context: ./src/Services/Auction
      dockerfile: Dockerfile
    container_name: nexus-auction-service
    ports:
      - "${AUCTION_SERVICE_PORT:-8005}:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${AUCTION_CONNECTION_STRING:-Host=auction-db;Port=5432;Database=auction_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      auction-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.7 Fulfillment Service (Kho vật lý, Tính phí ship, Vận đơn - Port 8006)
  fulfillment-service:
    build:
      context: ./src/Services/Fulfillment
      dockerfile: Dockerfile
    container_name: nexus-fulfillment-service
    ports:
      - "${FULFILLMENT_SERVICE_PORT:-8006}:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${FULFILLMENT_CONNECTION_STRING:-Host=fulfillment-db;Port=5432;Database=fulfillment_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      fulfillment-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.8 Notification Service (Thông báo, Cài đặt tùy chọn nhận tin - Port 8007)
  notification-service:
    build:
      context: ./src/Services/Notification
      dockerfile: Dockerfile
    container_name: nexus-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8007}:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${NOTIFICATION_CONNECTION_STRING:-Host=notification-db;Port=5432;Database=notification_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__UseSsl=${SMTP_USE_SSL:-false}
      - Smtp__SenderName=${SMTP_SENDER_NAME:-Nexus Ecosystem}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL:-}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      notification-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.9 Wallet Service (Ví điện tử, nạp, rút, chuyển tiền - Port 8008)
  wallet-service:
    build:
      context: ./src/Services/Wallet
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${WALLET_CONNECTION_STRING:-Host=wallet-db;Port=5432;Database=wallet_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      wallet-db:
        condition: service_healthy
    restart: unless-stopped

  # 2.10 CheckHeal Service (Keep-alive Neon/Render DB & Microservices Health - Port 8009)
  checkheal-service:
    build:
      context: ./src/Services/CheckHeal
      dockerfile: Dockerfile
    container_name: nexus-checkheal-service
    ports:
      - "${CHECKHEAL_SERVICE_PORT:-8009}:8009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8009
      - CHECKHEAL_API_KEY=${CHECKHEAL_API_KEY}
      - CheckHeal__ApiKey=${CHECKHEAL_API_KEY}
      - CheckHeal__CronIntervalSeconds=${CHECKHEAL_CRON_INTERVAL:-60}
      - CheckHeal__ProbeTimeoutSeconds=${CHECKHEAL_PROBE_TIMEOUT:-10}
      - CheckHeal__DefaultEnabled=${CHECKHEAL_DEFAULT_ENABLED:-false}
      - CheckHeal__Services__users__Url=${USERS_SERVICE_URL:-http://user-service:8001/health}
      - CheckHeal__Services__catalog__Url=${CATALOG_SERVICE_URL:-http://catalog-service:8002/health}
      - CheckHeal__Services__commerce__Url=${COMMERCE_SERVICE_URL:-http://commerce-service:8003/health}
      - CheckHeal__Services__log__Url=${LOG_SERVICE_URL:-http://log-service:8004/health}
      - CheckHeal__Services__auction__Url=${AUCTION_SERVICE_URL:-http://auction-service:8005/health}
      - CheckHeal__Services__fulfillment__Url=${FULFILLMENT_SERVICE_URL:-http://fulfillment-service:8006/health}
      - CheckHeal__Services__notification__Url=${NOTIFICATION_SERVICE_URL:-http://notification-service:8007/health}
      - CheckHeal__Services__wallet__Url=${WALLET_SERVICE_URL:-http://wallet-service:8008/health}
      - CheckHeal__Databases__users__ConnectionString=${USERS_DB_CONNECTION:-${USER_CONNECTION_STRING:-Host=user-db;Port=5432;Database=usermanagement_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__catalog__ConnectionString=${CATALOG_DB_CONNECTION:-${CATALOG_CONNECTION_STRING:-Host=catalog-db;Port=5432;Database=catalog_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__commerce__ConnectionString=${COMMERCE_DB_CONNECTION:-${COMMERCE_CONNECTION_STRING:-Host=commerce-db;Port=5432;Database=commerce_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__log__ConnectionString=${LOG_DB_CONNECTION:-${LOG_CONNECTION_STRING:-Host=log-db;Port=5432;Database=log_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__auction__ConnectionString=${AUCTION_DB_CONNECTION:-${AUCTION_CONNECTION_STRING:-Host=auction-db;Port=5432;Database=auction_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__fulfillment__ConnectionString=${FULFILLMENT_DB_CONNECTION:-${FULFILLMENT_CONNECTION_STRING:-Host=fulfillment-db;Port=5432;Database=fulfillment_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__notification__ConnectionString=${NOTIFICATION_DB_CONNECTION:-${NOTIFICATION_CONNECTION_STRING:-Host=notification-db;Port=5432;Database=notification_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - CheckHeal__Databases__wallet__ConnectionString=${WALLET_DB_CONNECTION:-${WALLET_CONNECTION_STRING:-Host=wallet-db;Port=5432;Database=wallet_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
    depends_on:
      user-db:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
      commerce-db:
        condition: service_healthy
      log-db:
        condition: service_healthy
      auction-db:
        condition: service_healthy
      fulfillment-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      wallet-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8009/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

