      context: ./src/Services/Log
      dockerfile: Dockerfile
    container_name: nexus-log-service
    ports:
      - "8004:8004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=log-db;Port=5432;Database=log_db;Username=postgres;Password=postgres
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__User=guest
      - RabbitMq__Password=guest
