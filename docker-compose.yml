    depends_on:
      log-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  auction-service:
    build:
      context: ./src/Services/Auction
      dockerfile: Dockerfile
    container_name: nexus-auction-service
    ports:
      - "8005:8005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=auction-db;Port=5432;Database=auction_db;Username=postgres;Password=postgres
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__User=guest
      - RabbitMq__Password=guest
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
